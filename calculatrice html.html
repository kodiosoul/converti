<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>document</title>
  </head>

    <fieldset class="main">
      <legend>Calcul</legend>
      <div class="formulaire">
        <form class="form">
          <div class="case">
            <label for="number1">Nombre 1</label>
            <input type="number" id="number1" name="number1" />
          </div>
          <div class="case">
            <label for="operator">Opérateur</label>
            <select name="operator" id="operator">
              <option value="+">+</option>
              <option value="-">-</option>
              <option value="*">*</option>
              <option value="/">/</option>
            </select>
          </div>
          <div class="case">
            <label for="number2">Nombre 2</label>
            <input type="number" id="number2" name="number2" />
          </div>
          <div class="case">
            <input type="button" value="Calculer" onclick="calculate()" />
          </div>
          <div class="case">
            <label for="result">Résultat</label>
            <input type="text" id="result" name="result" readonly />
          </div>
        </form>
      </div>
    </fieldset>

    <!-- JavaScript pour la calculatrice -->
    <script>
      function calculate() {
        const num1 = parseFloat(document.getElementById('number1').value);
        const num2 = parseFloat(document.getElementById('number2').value);
        const operator = document.getElementById('operator').value;
        let result = '';

        switch (operator) {
          case '+':
            result = num1 + num2;
            break;
          case '-':
            result = num1 - num2;
            break;
          case '*':
            result = num1 * num2;
            break;
          case '/':
            result = num1 / num2;
            break;
          default:
            result = 'Opérateur non valide';
        }

        document.getElementById('result').value = result;
      }
    </script>
  </body>
</html>
